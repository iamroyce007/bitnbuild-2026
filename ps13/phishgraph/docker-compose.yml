# One command: docker compose up --build   ->  dashboard + API on http://localhost:8000
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: phishgraph, POSTGRES_PASSWORD: phishgraph, POSTGRES_DB: phishgraph }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U phishgraph"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-neo4j}
      NEO4J_server_memory_heap_max__size: 1G
    volumes: [neo4jdata:/data]
    ports: ["7474:7474"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"], interval: 10s, retries: 30 }

  backend:
    build: { context: ., args: { WITH_EMBEDDINGS: "${WITH_EMBEDDINGS:-false}" } }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://phishgraph:phishgraph@postgres:5432/phishgraph
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
    ports: ["8000:8000"]
    volumes: [appdata:/app/data/processed]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  worker:
    build: { context: ., args: { WITH_EMBEDDINGS: "${WITH_EMBEDDINGS:-false}" } }
    command: ["python", "-m", "app.workers.run"]
    working_dir: /app/backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://phishgraph:phishgraph@postgres:5432/phishgraph
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      backend: { condition: service_started }

volumes: { pgdata: {}, neo4jdata: {}, appdata: {} }
